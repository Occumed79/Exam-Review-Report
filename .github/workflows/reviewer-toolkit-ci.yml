name: Reviewer Toolkit CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/sme-risk-engine run typecheck

      - name: Typecheck API server
        run: pnpm --filter @workspace/api-server run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/sme-risk-engine run build

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 NODE_ENV=production pnpm --filter @workspace/api-server run start > /tmp/reviewer-toolkit-server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          READY=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/api/health > /tmp/health.json; then
              READY=1
              break
            fi
            sleep 0.5
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/reviewer-toolkit-server.log
            exit 1
          fi

          grep -q '"ok":true' /tmp/health.json
          curl --fail --silent --show-error http://127.0.0.1:4173/api/intelligence/status > /tmp/intelligence-status.json
          grep -q '"ok":true' /tmp/intelligence-status.json
          grep -q '"measuredTables":true' /tmp/intelligence-status.json
          grep -q '"publicSevereInjuryData":true' /tmp/intelligence-status.json

          BLS_BAD_STATUS=$(curl --silent --output /tmp/bls-bad.json --write-out '%{http_code}' http://127.0.0.1:4173/api/injuries/occupation/bad)
          test "$BLS_BAD_STATUS" = "400"
          grep -q '"ok":false' /tmp/bls-bad.json

          OSHA_BAD_STATUS=$(curl --silent --output /tmp/osha-bad.json --write-out '%{http_code}' http://127.0.0.1:4173/api/injuries/osha-severe)
          test "$OSHA_BAD_STATUS" = "400"
          grep -q '"ok":false' /tmp/osha-bad.json

          ROUTES=(
            "/"
            "/injury-intelligence"
            "/job-intelligence"
            "/drugs"
            "/calculator"
            "/guidelines"
            "/matrix"
            "/aor"
            "/citations"
            "/sources"
            "/guideline-editor"
            "/settings"
          )

          for route in "${ROUTES[@]}"; do
            output="/tmp/route-$(echo "$route" | tr '/ ' '__').html"
            curl --fail --silent --show-error "http://127.0.0.1:4173${route}" > "$output"
            grep -q 'id="root"' "$output"
          done
